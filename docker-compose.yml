name: lastname-todo

services:
  server:
    build:
      context: .
      args:
        APP_VERSION: ${APP_VERSION:-0.0.1}
        SERVER_PORT: ${API_PORT:-5200}
    image: lastname-server:latest
    container_name: lastname-server
    restart: unless-stopped
    ports:
      - "${API_PORT:-5200}:${API_PORT:-5200}"
    environment:
      SERVER_PORT: ${API_PORT:-5200}
      MONGODB_URI: mongodb://${DB_USERNAME:-lastname_user}:${DB_PASSWORD:-change_me_20}@${DB_HOST:-db}:${DB_PORT:-27217}/${DB_NAME:-lastname_todo}?authSource=admin
    depends_on:
      db:
        condition: service_healthy
    networks:
      - backend-net

  db:
    image: mongo:7
    container_name: lastname-db
    restart: unless-stopped
    command: ["--port", "${DB_PORT:-27217}"]
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${DB_USERNAME:-lastname_user}
      MONGO_INITDB_ROOT_PASSWORD: ${DB_PASSWORD:-change_me_20}
      MONGO_INITDB_DATABASE: ${DB_NAME:-lastname_todo}
    volumes:
      - db-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--port", "${DB_PORT:-27217}", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - backend-net

networks:
  backend-net:
    driver: bridge

volumes:
  db-data:
